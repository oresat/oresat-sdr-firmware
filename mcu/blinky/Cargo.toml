[package]
name = "blinky"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = {version = "0.7.10", features = ["critical-section-single-core"]}
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10.0", features = ["defmt", "executor-thread", "platform-cortex-m"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "memory-x", "stm32u545re", "time-driver-any"] }
embassy-time = "0.5.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
